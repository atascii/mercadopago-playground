<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playground de API | Mercado Pago</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body class="bg-light">
    <header class="border-bottom bg-white"><div class="container py-3"><a class="text-decoration-none" href="/">← Volver a ejemplos</a></div></header>
    <main class="container py-5">
      <section class="card shadow-sm" aria-labelledby="page-title"><div class="card-body p-4">
        <h1 id="page-title" class="h3">Crear preferencia de prueba</h1>
        <p class="text-secondary">Este ejemplo envía dos productos fijos al endpoint local.</p>
        <ul class="list-group mb-4">
          <li class="list-group-item d-flex justify-content-between"><span>Celular Samsung × 1</span><strong>$50.000</strong></li>
          <li class="list-group-item d-flex justify-content-between"><span>TV Hitachi × 1</span><strong>$50.000</strong></li>
        </ul>
        <button id="btnGoToPayment" class="btn btn-primary" type="button">Generar pago</button>
        <p id="paymentStatus" class="mt-3 mb-0" role="status" aria-live="polite"></p>
      </div></section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
